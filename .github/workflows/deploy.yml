# .github/workflows/deploy.yml - build, gate, and publish the Astro site
# to GitHub Pages via the Actions deployment path.
#
# ARMED. Every push to master builds and deploys. The repository's Pages
# source was switched from "Deploy from a branch" to "GitHub Actions" on
# 2026-08-01, and the first successful deployment was verified live the
# same day, so the branch-root publishing path is no longer in use.
#
# Every gate below runs BEFORE any artifact is uploaded, so a failure
# stops the job before anything is published and the previously deployed
# site keeps serving. That ordering is load-bearing, not tidy: it is what
# makes this a gate rather than a report. Proven on 2026-08-01, when the
# first run failed at `astro build` on a Node version floor and published
# nothing.
name: Deploy to GitHub Pages

on:
  # Automatic deploy on every push to master.
  push:
    branches:
      - master
  # Kept alongside the push trigger so a deploy can still be re-run by
  # hand without an empty commit - useful when only repo settings or an
  # external dependency changed.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # `environment` is a job-level key, not a workflow-level one - it
    # has to live here for actions/deploy-pages@v5's OIDC token
    # exchange (the id-token: write permission above) to be scoped to
    # the github-pages environment GitHub Pages expects.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Must satisfy Astro's own engine floor, NOT just "some LTS". Astro 7
      # declares engines.node ">=22.12.0" and hard-EXITS on a lower version
      # rather than warning:
      #   "Node.js v20.20.2 is not supported by Astro!"
      # This pin was 20 and the first real deploy run failed on it (run
      # 30728264252, 2026-08-01). It passed locally the whole time because
      # local dev is on Node 24, so the gap was invisible until CI ran.
      #
      # Keep this at or above the local dev major. If you bump Astro, re-read
      # `node -p "require('./node_modules/astro/package.json').engines.node"`
      # and update here; package.json declares no `engines` field, so nothing
      # else in the repo pins this.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Lint and format gate (Biome). Runs before the build for the same
      # reason it runs first in verify:all: it needs no build output and
      # fails fastest. `biome check` exits non-zero on any finding at
      # error OR warning severity (verified locally, not assumed), and
      # this job has no continue-on-error anywhere, so this is a real
      # gate rather than a report. Scope is set by biome.jsonc's
      # allowlist (src/ scripts/ tests/ plus two config files), which
      # also excludes *.astro - Biome 2.5 parses only the frontmatter
      # fence, so it reports template-consumed consts as unused.
      - name: Lint (biome check)
        run: npx biome check .

      # Not strictly required by deploy-pages@v5 (it can resolve the
      # Pages environment on its own), but this is GitHub's own
      # recommended pattern: it fails the job here, immediately and
      # with a clear message, if repo Settings > Pages > Build and
      # deployment > Source has not yet been switched from "Deploy
      # from a branch" to "GitHub Actions" - instead of failing much
      # later at the actual deploy step with a less obvious error.
      - name: Configure Pages
        uses: actions/configure-pages@v6

      # No `continue-on-error` and no `if: always()` guard anywhere
      # below this step, deliberately. A GitHub Actions job stops at
      # the first non-zero-exit step by default - that default is what
      # makes this a real gate. Astro's own validateUrl() can abort a
      # build with exit 1 while still leaving a PARTIAL dist/ behind
      # (the agent-surface endpoints get written before the page that
      # fails), so relying on "dist/ exists" instead of the actual
      # build exit code would let a broken-but-not-empty site slip
      # through to the upload step below.
      - name: Build (astro build)
        run: npx astro build

      # Reference-aware gzipped-JS budget gate. See
      # scripts/check-js-budget.mjs for why this cannot be a glob over
      # dist/**/*.js - it must follow the same astro-island /
      # script-src / modulepreload reference chain a browser follows,
      # or it silently passes on JS a browser never fetches (or
      # silently passes at 0 KB if extraction itself is broken).
      - name: Check JS budget
        run: node scripts/check-js-budget.mjs

      # Reference-aware gzipped-CSS budget gate, the counterpart to the
      # JS one above. Same reason it cannot be a glob over
      # dist/**/*.css: a build can emit a stylesheet no page links.
      # Its unreferenced-selector list is informational and never
      # changes the exit code - see the script header for why.
      - name: Check CSS budget
        run: node scripts/check-css-budget.mjs

      - name: Run tests
        run: npx vitest run

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
